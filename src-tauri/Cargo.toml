[package]
name = "shellwarden"
version = "0.0.0-dev"
description = "Human-controlled shell access for AI agents over MCP"
authors = ["Mohamed F. Waziri"]
edition = "2021"
license = "MIT"
repository = "https://github.com/MohamedXIV/shellwarden"

[lib]
name = "shellwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
