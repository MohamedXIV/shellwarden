[package]
name = "shellwarden"
version = "0.0.0-dev"
description = "Human-controlled shell access for AI agents over MCP"
authors = ["Mohamed F. Waziri"]
edition = "2021"
license = "MIT"
repository = "https://github.com/MohamedXIV/shellwarden"

[lib]
name = "shellwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Keep the Rust side on the exact Tauri 2.11 companion set while the JS API/CLI are 2.11.
# Without a committed Cargo.lock, broad 2.x ranges can resolve incompatible 2.12 internals.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["http1", "tokio"] }
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-runtime = "=2.11.3"
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-macros = "=2.6.3"
tauri-utils = "=2.9.3"
tauri-plugin-notification = "~2.2.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.7.3"
winreg = "=0.55.0"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications"] }
